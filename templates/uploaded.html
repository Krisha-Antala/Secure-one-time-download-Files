<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Uploaded</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #2ecc71, #20c997); min-height: 100vh;">
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 shadow" style="max-width: 620px; width: 100%; border-radius: 16px;">
      <h3 class="text-success mb-3">File Uploaded Successfully</h3>

      <label class="form-label fw-bold">Share this link</label>
      <input class="form-control mb-3" value="{{ verify_url }}" readonly>

      <div class="mb-3">
        <span class="fw-bold">OTP:</span>
        <span class="badge bg-success fs-5">{{ otp }}</span>
      </div>

      <div class="alert alert-warning">
        The file will be deleted after one successful download.
      </div>

      <a href="/" class="btn btn-outline-success">Upload Another File</a>
    </div>
  </div>
</body>
</html>
