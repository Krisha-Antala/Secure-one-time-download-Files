<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure File Upload</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #2ecc71, #20c997); min-height: 100vh;">
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 shadow" style="max-width: 520px; width: 100%; border-radius: 16px;">
      <h2 class="mb-3 text-success">Secure File Upload</h2>

      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <input class="form-control" type="file" name="file" required>
        </div>

        <button type="submit" class="btn btn-success w-100">Upload File</button>
      </form>

      <p class="text-muted small mt-3 mb-0">
        Maximum file size: {{ max_file_size_mb }} MB. You will get a secure link and OTP.
      </p>
    </div>
  </div>
</body>
</html>
