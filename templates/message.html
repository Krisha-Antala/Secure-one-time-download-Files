<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #e74c3c, #c0392b); min-height: 100vh;">
  <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-4 shadow" style="max-width: 540px; width: 100%; border-radius: 16px;">
      <h3 class="text-danger mb-3">{{ title }}</h3>

      <p class="text-muted">{{ message }}</p>

      {% if home %}
        <a href="/" class="btn btn-outline-danger">Upload New File</a>
      {% endif %}
    </div>
  </div>
</body>
</html>
